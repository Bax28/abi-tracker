<style>
:root{--bg:#000;--s1:#1c1c1e;--s2:#2c2c2e;--tx:#f5f5f7;--mu:#8e8e93;--ac:#0a84ff;--red:#ff453a;--ok:#32d74b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:32px;letter-spacing:-.02em;margin:8px 0 18px;font-weight:700}
h2{font-size:15px;color:var(--mu);font-weight:500;margin:26px 4px 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(28,28,30,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;justify-content:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid #ffffff14}
nav button{flex:1;max-width:160px;background:none;border:0;color:var(--mu);font:inherit;font-size:14px;padding:10px 4px;border-radius:12px}
nav button.on{color:var(--tx);background:var(--s2)}
.card{background:var(--s1);border-radius:16px;padding:14px 16px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.mu{color:var(--mu);font-size:14px}
.big{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1}
button.pri{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;width:100%}
button.ghost{background:none;border:0;color:var(--ac);font:inherit;padding:6px}
button.del{background:none;border:0;color:var(--mu);font-size:20px;padding:4px 8px}
input,select{background:var(--s2);border:0;border-radius:10px;color:var(--tx);font:inherit;padding:11px 12px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
/* timeline */
.tl{position:relative;margin-left:8px;padding-left:22px;border-left:2px solid var(--s2)}
.it{position:relative;padding:12px 14px;background:var(--s1);border-radius:14px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.it::before{content:"";position:absolute;left:-30px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--c,var(--mu));border:2px solid var(--bg)}
.it.hw{--c:var(--ac)}.it.exam{--c:var(--red)}.it.talk{--c:#ff9f0a}
.it.done{opacity:.4}.it.done b{text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mu);background:none;flex:none;color:#000;font-size:14px;padding:0}
.done .chk{background:var(--ok);border-color:var(--ok)}
.now{position:relative;height:2px;background:var(--red);margin:14px 0 14px;border-radius:2px}
.now::before{content:"";position:absolute;left:-29px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--red)}
.now span{position:absolute;right:0;top:-22px;font-size:12px;color:var(--red);font-weight:600}
.due{font-size:13px;color:var(--mu);white-space:nowrap}.due.soon{color:var(--red)}
/* grades */
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.cells label{font-size:11px;color:var(--mu);display:block;margin-bottom:3px;text-align:center}
.cells input{text-align:center;padding:9px 2px}
.bar{height:6px;background:var(--s2);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:5}
.sheet.open{display:flex}
.sheet>div{background:var(--s1);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.seg{display:flex;background:var(--s2);border-radius:10px;padding:3px}
.seg button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:14px;padding:8px 2px;border-radius:8px}
.seg button.on{background:#48484a;color:var(--tx)}
.empty{text-align:center;color:var(--mu);padding:40px 20px}
.lk{font-size:12px;color:var(--mu);display:flex;gap:6px;align-items:center}
.lk input{width:auto}
.dot{width:12px;height:12px;border-radius:50%;flex:none}.card.row{cursor:default}
.tlS{overflow-x:auto;margin:0 -16px 8px;padding:0 16px 10px;-webkit-overflow-scrolling:touch}
.tlC{position:relative}
.tk{position:absolute;top:0;bottom:0;border-left:1px solid #ffffff12;padding:2px 0 0 6px;font-size:12px;color:var(--mu);line-height:1.15}
.tk b{display:block;font-size:17px;color:var(--tx);font-weight:600}.tk.we b{color:var(--mu)}.tk.td b{color:var(--red)}.tk.td{color:var(--red)}
.tk .mo{display:block;font-size:11px}
.ax{position:absolute;left:0;right:0;top:41px;height:1px;background:var(--s2)}
.cn{position:absolute;width:2px;margin-left:-1px;opacity:.7}
.cd{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg);box-sizing:content-box;margin:-2px 0 0 -2px}
.ic{position:absolute;background:var(--s1);border-radius:12px;padding:8px 8px 6px 10px;display:grid;gap:2px;height:78px;align-content:space-between}
.ic.done{opacity:.4}
.nw{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3;margin-left:-1px}
.nw span{position:absolute;top:-2px;left:4px;font-size:11px;font-weight:600;color:#fff;background:var(--red);border-radius:6px;padding:1px 6px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="form"></div></div>
<script>
const Q=["11/1","11/2","12/1","12/2"],TYPES={hw:"Hausaufgabe",exam:"Klausur",talk:"Vortrag"};
let S={subjects:[],items:[],exams:["","","","",""]},tab="tl",ftype="hw";
try{const r=localStorage.getItem("abi");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("abi",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const dayDiff=s=>Math.round((new Date(s+"T00:00")-new Date(today()+"T00:00"))/864e5);
const fmt=s=>new Date(s+"T00:00").toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"});
const uid=()=>Math.random().toString(36).slice(2,9);
function dueLabel(s){const d=dayDiff(s);return d===0?"Heute":d===1?"Morgen":d===-1?"Gestern":d<0?"vor "+-d+" Tagen":"in "+d+" Tagen"}

function render(){
  $("nav").innerHTML=[["tl","Zeitstrahl"],["gr","Noten"],["abi","Abitur"]].map(([k,t])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()">${t}</button>`).join("");
  if(lastTab!==tab)tlScroll=null;lastTab=tab;
  const o=$("tlS");if(o)tlScroll=o.scrollLeft;
  $("app").innerHTML=tab==="tl"?vTl():tab==="gr"?vGr():vAbi();
  const e=$("tlS");if(e)e.scrollLeft=tlScroll===null?tlTarget:tlScroll;
}

/* Zeitstrahl */
let tlScroll=null,tlTarget=0,lastTab="tl";
const PX=84,CW=146,LH=88;
const setMode=m=>{S.tlm=m;tlScroll=null;save();render()};
function vTl(){
  const t=today(),m=S.tlm||"n3",all=[...S.items].sort((a,b)=>a.date.localeCompare(b.date));
  const open=all.filter(i=>!i.done),over=open.filter(i=>i.date<t),up=open.filter(i=>i.date>=t);
  const items=m==="n3"?[...over,...up.slice(0,3)]:m==="d7"?[...over,...up.filter(i=>dayDiff(i.date)<=7)]:m==="d30"?[...over,...up.filter(i=>dayDiff(i.date)<=30)]:all;
  let h=`<h1>Zeitstrahl</h1>`;
  if(!S.items.length)return h+`<div class="empty">Noch nichts eingetragen.<br>Füge deine erste Hausaufgabe, Klausur oder deinen ersten Vortrag hinzu.</div><button class="pri" onclick="openForm()">Hinzufügen</button>`;
  h+=`<div class="seg" style="margin-bottom:14px">${[["n3","Nächste 3"],["d7","7 Tage"],["d30","30 Tage"],["all","Alles"]].map(([k,l])=>`<button class="${m===k?"on":""}" onclick="setMode('${k}')">${l}</button>`).join("")}</div>`;
  const ds=items.map(i=>dayDiff(i.date)),startD=Math.min(-1,...ds),endD=Math.max(m==="d7"?7:m==="d30"?30:4,...ds)+1;
  const x=d=>(d-startD)*PX,W=(endD-startD+1)*PX+30,d0=new Date(t+"T00:00");
  let ticks="";
  for(let d=startD;d<=endD;d++){const dt=new Date(d0);dt.setDate(dt.getDate()+d);const we=dt.getDay()%6===0;
    ticks+=`<div class="tk ${d===0?"td":""} ${we?"we":""}" style="left:${x(d)}px;width:${PX}px"><span>${dt.toLocaleDateString("de-DE",{weekday:"short"}).replace(".","")}</span><b>${dt.getDate()}</b>${dt.getDate()===1||d===startD?`<span class="mo">${dt.toLocaleDateString("de-DE",{month:"short"}).replace(".","")}</span>`:""}</div>`}
  const ends=[];let cards="";
  items.forEach(i=>{const d=dayDiff(i.date),x0=x(d)+8;let l=ends.findIndex(e=>e<=x0);if(l<0)l=ends.length;ends[l]=x0+CW+8;
    const u=urg(i),c=i.done?"#636366":u.c,top=58+l*LH;
    cards+=`<div class="cn" style="left:${x0}px;top:44px;height:${top-44}px;background:${c}"></div><div class="cd" style="left:${x0-5}px;top:38px;background:${c}"></div>
    <div class="ic ${i.done?"done":""}" style="left:${x0}px;top:${top}px;width:${CW}px;border-left:4px solid ${c}"><div class="row" style="gap:6px;align-items:flex-start"><b class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px">${esc(i.title)}</b><button class="chk" style="width:22px;height:22px;font-size:12px" onclick="tog('${i.id}')" aria-label="Erledigt">${i.done?"✓":""}</button></div><div class="mu" style="font-size:12px">${TYPES[i.type]}${i.subject?" · "+esc(i.subject):""}</div><div class="row" style="justify-content:space-between"><span class="due" style="${i.done?"":"color:"+c}">${dueLabel(i.date)}${!i.done&&u.a!==null&&u.a<8?" · lernen":""}</span><button class="del" style="font-size:16px;padding:0 2px" onclick="rm('${i.id}')" aria-label="Löschen">×</button></div></div>`});
  const H=Math.max(190,58+Math.max(1,ends.length)*LH+8),n=new Date(),fr=(n.getHours()*60+n.getMinutes())/1440;
  tlTarget=Math.max(0,x(0)-24);
  h+=`<div class="tlS" id="tlS"><div class="tlC" style="width:${W}px;height:${H}px">${ticks}<div class="ax"></div>${cards}<div class="nw" style="left:${(0-startD+fr)*PX}px"><span>Heute</span></div></div></div>`;
  if(!items.length)h+=`<div class="empty" style="padding:10px">Nichts in diesem Zeitraum.</div>`;
  return h+`<p class="mu" style="padding:0 4px">Der Abstand zeigt, wie viel Zeit zwischen den Terminen liegt. Farbe: rot dringend, orange bald, grün ruhig – je nach Termin und deinem Notenstand.</p><button class="pri" onclick="openForm()">Hinzufügen</button>`;
}
function urg(i){const sb=S.subjects.find(x=>x.name.toLowerCase()===(i.subject||"").toLowerCase()),a=sb?sAvg(sb):null;
  const weak=a===null?.3:Math.min(1,Math.max(0,(11-a)/8)),d=dayDiff(i.date),prox=d<0?1:Math.max(0,1-d/14);
  const sc=weak*.45+prox*.55+(i.type==="exam"?.1:0);return{a,c:sc>.65?"#ff453a":sc>.4?"#ff9f0a":"#32d74b"}}
const tog=id=>{const i=S.items.find(x=>x.id===id);i.done=!i.done;save();render()};
const rm=id=>{S.items=S.items.filter(x=>x.id!==id);save();render()};
function openForm(){
  const opts=S.subjects.map(s=>`<option>${esc(s.name)}</option>`).join("");
  $("form").innerHTML=`<div class="seg">${Object.entries(TYPES).map(([k,v])=>`<button class="${ftype===k?"on":""}" onclick="ftype='${k}';openForm()">${v}</button>`).join("")}</div>
  <input id="fT" placeholder="Titel, z. B. Aufgaben S. 42" autocomplete="off">
  <input id="fS" list="subs" placeholder="Fach" autocomplete="off"><datalist id="subs">${opts}</datalist>
  <input id="fD" type="date" value="${today()}">
  <button class="pri" onclick="addItem()">Speichern</button><button class="ghost" onclick="closeForm()">Abbrechen</button>`;
  $("sheet").classList.add("open");
}
const closeForm=()=>$("sheet").classList.remove("open");
function addItem(){
  const title=$("fT").value.trim(),date=$("fD").value;
  if(!title||!date){$("fT").focus();return}
  S.items.push({id:uid(),type:ftype,title,subject:$("fS").value.trim(),date,done:false});
  save();closeForm();render();
}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeForm()});

/* Noten */
const TY={k:"Klausur",o:"Mündlich",w:"Schriftlich"},NT=["6","5-","5","5+","4-","4","4+","3-","3","3+","2-","2","2+","1-","1","1+"];
let sel=null,selH=0;
if(S.cur===undefined)S.cur=0;if(S.kw===undefined||!S.v||S.v<3){S.kw=33;S.v=3}
const emptyH=()=>({k:[],o:[],w:[]});
S.subjects.forEach(s=>{if(!s.hj){s.hj=(s.pts||[]).map(p=>{const h=emptyH();if(p!==""&&p!==null)h.o.push({id:uid(),p:+p,t:"Übernommen"});return h});delete s.pts}while(s.hj.length<4)s.hj.push(emptyH())});
S.exams=[0,1,2,3].map(i=>S.exams&&S.exams[i]!==undefined?S.exams[i]:"");
const mean=a=>a.length?a.reduce((t,e)=>t+e.p,0)/a.length:null;
function hAvg(s,h){const x=s.hj[h],kw=S.kw===33?1/3:S.kw/100,r=(1-kw)/2;
  const P=[[mean(x.k),kw],[mean(x.o),r],[mean(x.w),r]].filter(a=>a[0]!==null);
  if(!P.length)return null;const W=P.reduce((t,a)=>t+a[1],0);return P.reduce((t,a)=>t+a[0]*a[1],0)/W}
const kp=(s,h)=>{const a=hAvg(s,h);return a===null?null:Math.round(a)};
function sAvg(s){for(let h=S.cur;h>=0;h--){const a=hAvg(s,h);if(a!==null)return a}return null}
function lvl(a){return a===null?{c:"#8e8e93",t:"Noch keine Note"}:a<5?{c:"#ff453a",t:"Dringend lernen"}:a<8?{c:"#ff9f0a",t:"Wackelig"}:a<11?{c:"#ffd60a",t:"Solide"}:{c:"#32d74b",t:"Stark"}}
const f1=n=>n.toFixed(1).replace(".",",");
function vGr(){
  if(sel)return vDet();
  const L=S.subjects.map(s=>({s,a:sAvg(s)})).sort((x,y)=>(x.a===null?99:x.a)-(y.a===null?99:y.a));
  const weak=L.filter(x=>x.a!==null&&x.a<8);
  let h=`<h1>Noten</h1><div class="card row"><div class="grow"><b>Aktuelles Halbjahr</b><div class="mu">Danach richtet sich der Lernbedarf</div></div><select style="width:auto" onchange="S.cur=+this.value;save();render()">${Q.map((q,i)=>`<option value="${i}" ${S.cur===i?"selected":""}>${q}</option>`).join("")}</select></div>`;
  if(weak.length)h+=`<div class="card" style="border:1px solid #ff9f0a66"><b>Hier solltest du lernen</b><div class="mu">${weak.map(x=>esc(x.s.name)+" (Ø "+f1(x.a)+")").join(", ")}</div></div>`;
  if(!L.length)h+=`<div class="empty">Lege deine Fächer an, tippe sie an und trage einzelne Noten ein.</div>`;
  h+=L.map(({s,a})=>{const v=lvl(a);return `<div class="card row" onclick="sel='${s.id}';selH=S.cur;render()" style="cursor:pointer"><span class="dot" style="background:${v.c}"></span><div class="grow"><b>${esc(s.name)}</b>${s.lk?` <span class="mu">LK</span>`:""}<div class="mu" style="color:${v.c}">${v.t}</div></div><div style="text-align:right"><b>${a===null?"–":f1(a)}</b><div class="mu">${a===null?"":"Note "+NT[Math.round(a)]}</div></div></div>`}).join("");
  h+=`<div class="card row"><input id="nS" placeholder="Neues Fach, z. B. Mathematik" autocomplete="off"><button class="ghost" onclick="addSub()">Hinzufügen</button></div>`;
  h+=`<h2>Gewichtung</h2><div class="card row"><div class="grow"><b>Klausuren</b><div class="mu">Mündlich und schriftlich teilen sich den Rest 50 : 50</div></div><input type="number" min="10" max="60" value="${S.kw}" style="width:80px" onchange="S.kw=Math.max(10,Math.min(60,+this.value||33));save();render()"><span class="mu">%</span></div>`;
  return h;
}
function vDet(){
  const s=S.subjects.find(x=>x.id===sel);if(!s){sel=null;return vGr()}
  const a=hAvg(s,selH),v=lvl(a);
  const bars=Q.map((q,i)=>{const k=kp(s,i),c=lvl(k).c;return `<div style="flex:1;text-align:center"><div style="height:64px;display:flex;align-items:flex-end"><i style="display:block;width:100%;border-radius:6px;background:${k===null?"var(--s2)":c};height:${k===null?4:Math.max(8,k/15*100)}%"></i></div><div class="mu" style="font-size:12px;margin-top:4px">${q}<br>${k===null?"–":k}</div></div>`}).join("");
  const sec=t=>{const arr=s.hj[selH][t],m=mean(arr);return `<h2>${TY[t]}${t==="k"?" · "+S.kw+" %":""}${m!==null?" · Ø "+f1(m):""}</h2>`+(arr.length?arr.map(e=>`<div class="card row" style="padding:10px 16px"><b style="width:32px">${e.p}</b><div class="grow mu">${esc(e.t||"")||"Note "+NT[e.p]}</div><span class="mu">${NT[e.p]}</span><button class="del" onclick="delE('${t}','${e.id}')" aria-label="Löschen">×</button></div>`).join(""):`<div class="mu" style="padding:0 4px">Noch nichts eingetragen</div>`)};
  return `<div class="row"><button class="ghost" onclick="sel=null;render()">‹ Fächer</button></div><h1>${esc(s.name)}</h1>
  <div class="seg" style="margin-bottom:12px">${Q.map((q,i)=>`<button class="${selH===i?"on":""}" onclick="selH=${i};render()">${q}</button>`).join("")}</div>
  <div class="card"><div class="row"><div class="grow"><div class="big">${a===null?"–":f1(a)}</div><div class="mu" style="margin-top:6px;color:${v.c}">${v.t}${a!==null?" · Note "+NT[Math.round(a)]:""}</div></div></div></div>
  <h2>Verlauf (Kurspunkte je Halbjahr)</h2><div class="card" style="display:flex;gap:10px">${bars}</div>
  <h2>Note hinzufügen</h2><div class="card" style="display:grid;gap:8px"><select id="aT"><option value="k">Klausur</option><option value="o">Mündlich</option><option value="w">Schriftlich (Test, Abfrage)</option></select><input id="aP" type="number" inputmode="numeric" min="0" max="15" placeholder="Punkte 0–15"><input id="aN" placeholder="Titel (optional)" autocomplete="off"><button class="pri" onclick="addE()">Speichern</button></div>
  ${sec("k")}${sec("o")}${sec("w")}
  <div class="card row" style="margin-top:18px"><label class="lk grow"><input type="checkbox" ${s.lk?"checked":""} onchange="setLk('${s.id}',this.checked)">Leistungskurs</label><button class="ghost" style="color:var(--red)" onclick="rmSub('${s.id}')">Fach löschen</button></div>`;
}
function addE(){const p=$("aP").value;if(p===""||+p<0||+p>15){$("aP").focus();return}
  s=S.subjects.find(x=>x.id===sel);s.hj[selH][$("aT").value].push({id:uid(),p:Math.round(+p),t:$("aN").value.trim()});save();render()}
function delE(t,id){const s=S.subjects.find(x=>x.id===sel);s.hj[selH][t]=s.hj[selH][t].filter(e=>e.id!==id);save();render()}
function addSub(){const n=$("nS").value.trim();if(!n)return;S.subjects.push({id:uid(),name:n,lk:false,hj:[emptyH(),emptyH(),emptyH(),emptyH()]});save();render()}
const rmSub=id=>{if(!confirm("Fach mit allen Noten löschen?"))return;S.subjects=S.subjects.filter(s=>s.id!==id);sel=null;save();render()};
const setLk=(id,v)=>{S.subjects.find(s=>s.id===id).lk=v;save();render()};

/* Abitur */
function calc(){
  let sum=0,w=0,gk=[],lkLow=0,zero=0;
  S.subjects.forEach(s=>s.hj.forEach((_,h)=>{const k=kp(s,h);if(k===null)return;if(k===0)zero++;if(s.lk){sum+=k*2;w+=2;if(k<5)lkLow++}else gk.push(k)}));
  gk.sort((a,b)=>b-a);const used=gk.slice(0,30);used.forEach(k=>{sum+=k;w++});
  const avg=w?sum/w:null,b1=avg===null?0:Math.round(avg*40);
  const ex=S.exams.filter(e=>e!=="").map(Number),b2=ex.reduce((t,e)=>t+e*5,0),open=4-ex.length;
  const fill=avg===null?0:Math.round(open*avg*5),total=b1+b2+fill;
  return{avg,b1,b2,open,fill,total,lkLow,gkLow:used.filter(k=>k<5).length,zero,ex,w}
}
const gradeOf=t=>t>=823?1:Math.min(4,1+Math.ceil((823-t)/18)/10);
function vAbi(){
  const c=calc(),has=c.avg!==null,tot=c.total,pass=tot>=300;
  const ck=(t,b)=>`<div class="row" style="padding:5px 0"><span style="color:${b?"var(--ok)":"var(--red)"};width:18px">${b?"✓":"!"}</span><span class="grow" style="font-size:14px">${t}</span></div>`;
  return `<h1>Abitur</h1><div class="card"><div class="mu">${c.open?"Prognose Abiturnote":"Abiturnote"}</div>
  <div class="big" style="margin:8px 0">${has&&pass?f1(gradeOf(tot)):"–"}</div>
  <div class="mu">${has?(pass?tot+" von 900 Punkten"+(c.open?" · fehlende Prüfungen mit deinem Kursschnitt gerechnet":""):tot+" Punkte · zum Bestehen sind 300 nötig"):"Trage Noten ein, dann wird gerechnet."}</div>
  <div class="bar"><i style="width:${Math.min(100,tot/9)}%"></i></div></div>
  <h2>Qualifikationsphase (max. 600)</h2>
  <div class="card"><b>${c.b1} Punkte</b><div class="mu">${has?"Ø "+f1(c.avg)+" · Leistungskurse doppelt, beste 30 Grundkurs-Halbjahre":"Noch keine Kurse bewertet"}</div></div>
  <h2>Abiturprüfungen (je Punkte ×5, max. 300)</h2>
  <div class="card"><div class="cells">${["Schriftl. 1","Schriftl. 2","Schriftl. 3","Mündlich"].map((l,n)=>`<div><label>${l}</label><input type="number" inputmode="numeric" min="0" max="15" value="${S.exams[n]}" onchange="setEx(${n},this.value)"></div>`).join("")}</div></div>
  <h2>Mindestanforderungen</h2>
  <div class="card">${ck("Leistungskurse: höchstens 3 Halbjahre unter 5 Punkten ("+c.lkLow+")",c.lkLow<=3)}${ck("Grundkurse: höchstens 4 Halbjahre unter 5 Punkten ("+c.gkLow+")",c.gkLow<=4)}${ck("Kein Kurs mit 0 Punkten",c.zero===0)}${ck("Qualifikationsphase mindestens 200 Punkte ("+c.b1+")",c.b1>=200||!has)}${ck("Prüfungen: mindestens 3 mit 5 Punkten oder mehr",c.ex.filter(e=>e<5).length<=1)}${ck("Prüfungsbereich mindestens 100 Punkte"+(c.open?" (noch offen)":" ("+c.b2+")"),c.open?true:c.b2>=100)}</div>
  <p class="mu" style="padding:0 4px">Nach GOSTV Brandenburg. Welche Kurse eingebracht werden, legst du mit deiner Oberstufenkoordination fest.</p>`;
}
const setEx=(n,v)=>{S.exams[n]=v===""?"":Math.max(0,Math.min(15,Math.round(+v)));save();render()};

render();
setInterval(()=>{if(tab==="tl"&&!$("sheet").classList.contains("open"))render()},60000);
</script>
</body>
</html>
